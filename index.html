<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Sculpt Clay - Ultimate Sphere Power</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
            z-index: 10;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            background: #333;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #444; }
        button.active { background: #ff7b00; }
        label { font-size: 12px; color: #aaa; }
        .slider-container { display: flex; align-items: center; gap: 10px; }
        .slider-value { font-size: 14px; color: #ff7b00; font-weight: bold; min-width: 35px; }
    </style>
</head>
<body>

    <div id="ui">
        <div><strong>Clay Tools</strong></div>
        <button id="btn-add" class="active" onclick="setMode('add')">盛る (Add)</button>
        <button id="btn-sub" onclick="setMode('sub')">削る (Subtract)</button>
        <hr style="border-color:#444;">
        <label>ブラシサイズ</label>
        <input type="range" id="brush-size" min="0.2" max="1.5" step="0.1" value="0.8">
        <label>強度 (Strength)</label>
        <div class="slider-container">
            <input type="range" id="brush-strength" min="0.1" max="1.0" step="0.05" value="0.5" oninput="document.getElementById('val-strength').innerText=this.value">
            <span id="val-strength" class="slider-value">0.5</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // ライト（陰影を強調して削った凹凸を見えやすく）
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);
        const dirLight1 = new THREE.DirectionalLight(0xfff5ea, 1.5); 
        dirLight1.position.set(10, 15, 10);
        scene.add(dirLight1);
        const dirLight2 = new THREE.DirectionalLight(0x88aaff, 0.5); 
        dirLight2.position.set(-10, -10, -5);
        scene.add(dirLight2);

        // --- 粘土球体（現実的な限界の滑らかさ） ---
        const geometry = new THREE.SphereGeometry(2, 256, 256); 
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xdfb08c, 
            roughness: 0.5, 
            metalness: 0.0,
            flatShading: false 
        });
        const clay = new THREE.Mesh(geometry, material);
        scene.add(clay);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDrawing = false;
        let currentMode = 'add';

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-add').classList.toggle('active', mode === 'add');
            document.getElementById('btn-sub').classList.toggle('active', mode === 'sub');
        }

        window.addEventListener('mousedown', (e) => { 
            if (e.button === 0) {
                updateMousePos(e);
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(clay);

                if (intersects.length > 0) {
                    isDrawing = true;
                    controls.enabled = false;
                    sculptClay(intersects[0].point);
                }
            }
        });

        window.addEventListener('mouseup', () => { 
            isDrawing = false; 
            controls.enabled = true; 
        });

        window.addEventListener('mousemove', (e) => {
            updateMousePos(e);
            if (!isDrawing) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(clay);

            if (intersects.length > 0) {
                sculptClay(intersects[0].point);
            }
        });

        function updateMousePos(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        // --- 彫刻ロジック（ワールド座標完全対応版） ---
        function sculptClay(worldPoint) {
            const positionAttribute = geometry.attributes.position;
            const vertex = new THREE.Vector3();
            const worldVertex = new THREE.Vector3();
            
            const brushRadius = parseFloat(document.getElementById('brush-size').value);
            // 削る威力を体感できるように基本倍率を大幅アップ
            const brushStrength = parseFloat(document.getElementById('brush-strength').value) * 0.4; 

            // マウスが当たった「ワールド座標」を「ローカル座標」に変換して計算を正確にする
            const localPoint = worldPoint.clone().applyMatrix4(clay.matrixWorld.invert());

            for (let i = 0; i < positionAttribute.count; i++) {
                vertex.fromBufferAttribute(positionAttribute, i);
                
                // 正確な距離を測る
                const distance = vertex.distanceTo(localPoint);

                if (distance < brushRadius) {
                    const ratio = distance / brushRadius;
                    let influence = (Math.cos(ratio * Math.PI) + 1) / 2; // スムーズな山型

                    // 変形させる方向（球体の中心から外側へのベクトル）
                    const moveDirection = vertex.clone().normalize();
                    const directionSign = (currentMode === 'add') ? 1 : -1;

                    if (currentMode === 'sub') {
                        // 【超ガリガリ化】削るときは中央を鋭く抉り取る（2乗）
                        influence = Math.pow(influence, 2);
                    }

                    // 頂点を移動
                    vertex.addScaledVector(moveDirection, brushStrength * influence * directionSign);
                    
                    // 削りすぎて裏側に突き抜けないためのストッパー（芯を残す）
                    if (vertex.length() < 0.1 && currentMode === 'sub') {
                        vertex.setLength(0.1);
                    }

                    positionAttribute.setXYZ(i, vertex.x, vertex.y, vertex.z);
                }
            }

            positionAttribute.needsUpdate = true;
            geometry.computeVertexNormals(); // 影の再計算
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
